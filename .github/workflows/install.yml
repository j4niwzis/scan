# What this library is, built the way somebody else would build it.
#
# Three questions, and the third is the one nothing here ever asked: does it
# build, do the tests pass, and is what it installs something a consumer can
# use? A module library installs its interface units beside the archive --
# whoever links it compiles them itself -- so an install that is wrong is a
# library nobody can consume, and every part of that is written in
# CMakeLists.txt where nothing runs it.
name: install

on:
  push:
    branches: [main]
    # A tag is a release: the same run, with what it made attached to it.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run to a commit on the main branch, and they do not wait for each other:
# what is being asked is whether that commit is good, and a commit does not
# become good by being answered later. A branch under review is the other way
# round -- only the tip is worth an answer, so a push cancels the run before
# it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The header generator, by the release it is taken from. One place, so that
# moving to a newer one is one line.
env:
  DEMODULIZER: 0.1.1

jobs:
  # The other compiler, asked the one question that matters here: does this
  # library compile where it is not clang? As the modules it is written as --
  # every interface unit of it, with `import std` and all.
  #
  # In a container rather than on the runner, because `import std` wants a
  # libstdc++ that ships the module's source and a GCC that reads it without
  # tripping over its own <ranges>: 15.2 does not -- it says the deduced return
  # type of `iota_view::size` conflicts with the one it imported -- and 15.3
  # does. An image is where a version can be asked for.
  gcc:
    name: gcc ${{ matrix.gcc }}, libstdc++, import std
    runs-on: ubuntu-24.04
    container: debian:unstable
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        gcc: [15]
    steps:
      - name: what a container has not got
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++-${{ matrix.gcc }} ninja-build curl ca-certificates git \
            python3 tar xz-utils
          g++-${{ matrix.gcc }} --version

      - uses: actions/checkout@v4

      - name: cmake
        run: |
          version=4.4.3
          curl -sSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
          tar xzf cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: what was fetched before
        uses: actions/cache@v4
        with:
          path: ~/.cache/cmake-everywhere
          key: scan-gcc-${{ matrix.gcc }}-${{ hashFiles('cmake/get_cme.cmake', 'cme-lock.json') }}
          restore-keys: scan-gcc-${{ matrix.gcc }}-

      # The library, and not the tests with it.
      #
      # Every test here says `import gtest`, and googletest's module port does
      # not build with GCC: the umbrella exports the interface of
      # `gtest.gtest_typed_test`, and that module's implementation unit
      # (`src/impl/modules/gtest-typed-test.cc`) imports the umbrella back. GCC
      # refuses -- "cannot import module in its own purview" -- and clang does
      # not. Nothing here can be written differently to avoid it; when the port
      # builds, this grows a `ctest` line and the comment goes away.
      - name: build
        run: |
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-${{ matrix.gcc }} \
            -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }} \
            -DSCAN_BUILD_TESTS=OFF \
            -DCME_STORE_ENABLED=ON -DCME_SOURCES_ENABLED=ON
          cmake --build build-gcc --target scan

  install:
    name: clang ${{ matrix.llvm }}, libc++, import std
    # Only the tag runs write anything; the rest read.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # One entry, and a second is one line: the library is written against
        # C++23 modules and asks nothing of a compiler that a release before
        # this one does not have.
        llvm: [22]
    steps:
      - uses: actions/checkout@v4

      # Clang and libc++, which is where `import std` comes from: the library
      # ships the source of the std module and CMake compiles it. The -dev
      # package is what carries it.
      - name: clang and libc++
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ninja-build lsb-release software-properties-common gnupg curl
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y libc++-${{ matrix.llvm }}-dev libc++abi-${{ matrix.llvm }}-dev
          echo /usr/lib/llvm-${{ matrix.llvm }}/bin >> "$GITHUB_PATH"

      - name: cmake
        run: |
          version=4.4.3
          curl -sSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
          sudo tar xzf cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      # Where `import std` is read from, put where this build looks for it.
      #
      # The source of the std module is in the toolchain's own directory --
      # <toolchain>/share/libc++/v1/std.cppm -- and what CMake asks for is
      # /lib/share/libc++/v1/std.cppm, which no package puts there. It is
      # worked out from where the compiler is, and the compiler a
      # distribution installs is a link in a directory that says nothing
      # about its toolchain. So both ends are said outright: the compiler
      # under a prefix of its own, and the module sources where the answer
      # lands.
      - name: where import std is read from
        run: |
          sudo mkdir -p /lib/share/libc++
          sudo ln -sfn /usr/lib/llvm-${{ matrix.llvm }}/share/libc++/v1 /lib/share/libc++/v1
          sudo ln -sf /usr/lib/llvm-${{ matrix.llvm }}/bin/clang++ /usr/local/bin/clang++
          sudo ln -sf /usr/lib/llvm-${{ matrix.llvm }}/bin/clang /usr/local/bin/clang
          test -f /lib/share/libc++/v1/std.cppm
          test -f /lib/share/libc++/v1/std.compat.cppm

      # What the ports were fetched from and what came out of building them.
      # Keyed by the pin and the lock, so a run that changes neither fetches
      # and builds nothing.
      - name: what was fetched and built before
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cmake-everywhere/sources
            ~/.cache/cmake-everywhere/store
          # The compiler is part of the key, and not a detail of it: what the
          # store keeps are compiled modules, and a module built by one clang
          # is not readable by another. A key without it restored a copy built
          # by the release before this one, and what said so was a test that
          # could not find a header.
          # The generation is bumped by hand where a stored copy has to be
          # thrown away. A key that only grew a compiler to it was not enough:
          # the first run with the new compiler restored the old store through
          # the old prefix, and then saved that mixture under the new name.
          key: scan-2-${{ matrix.llvm }}-${{ hashFiles('cmake/get_cme.cmake', 'cme-lock.json') }}-${{ github.sha }}
          restore-keys: scan-2-${{ matrix.llvm }}-${{ hashFiles('cmake/get_cme.cmake', 'cme-lock.json') }}-

      - name: build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/local/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCME_STORE_ENABLED=ON \
            -DCME_SOURCES_ENABLED=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build

      # The headers, for whoever cannot take modules. One set, which answers
      # to both switches: what is generated keeps the condition around the
      # import it came from, so the same files read Boost.PFR or take an
      # aggregate apart with a binding pack, by what the consumer defines.
      #
      # Generated rather than kept: the sources stay module interface units
      # and pay nothing for the fallback. What generates them is released on
      # its own and comes down as a binary, so this repository carries no
      # libtooling and no clang development packages.
      - name: the header generator
        run: |
          curl -fsSL -o demodulizer \
            https://github.com/j4niwzis/demodulizer/releases/download/v${{ env.DEMODULIZER }}/demodulizer
          chmod +x demodulizer

      # The interfaces it parses are the ones a build just compiled: CMake
      # writes the mapping from module name to compiled interface beside each
      # object, and that is exactly the flags the tool wants -- so nothing
      # here has to know how the ports were built or where Boost.PFR came
      # from. The map's paths are relative to the build directory and quoted,
      # which a shell splitting on spaces keeps rather than removes.
      - name: the headers, generated
        run: |
          generate() {
            from=$1; into=$2
            mkdir -p "$into"
            for one in src/*.cc; do
              map="$from/CMakeFiles/scan.dir/$one.o.modmap"
              if [ ! -f "$map" ]; then
                echo "no module map at $map; what there is:"
                find "$from" -name '*.modmap' | head -20
                exit 1
              fi
              flags=$(sed -n 's|^-fmodule-file="\([^=]*\)=\(.*\)"$|-fmodule-file=\1='"$PWD/$from"'/\2|p' "$map")
              ./demodulizer --into="$into" --spell 'boost.pfr=<boost/pfr.hpp>' \
                "$one" -- clang++ -std=c++23 -stdlib=libc++ -x c++-module $flags
            done
            ls -l "$into"
          }
          generate build include

      # A header that compiles is not yet a header that links: a definition at
      # namespace scope that is not inline is one per translation unit that
      # includes it, and one translation unit never shows that. The generator
      # refuses those on sight -- this is the other half, and it is the answer
      # rather than the argument.
      - name: and they build, and link twice
        run: |
          pfr=$(find ~/.cache/cmake-everywhere build -name pfr.hpp -path '*boost*' 2>/dev/null | head -1)
          test -n "$pfr" || { echo "Boost.PFR headers not found"; exit 1; }
          pfr_include=$(dirname "$(dirname "$pfr")")
          cat > /tmp/one.cc <<'EOF'
          #include "scan.hpp"
          struct row { std::string_view left, right; };
          int how_long(const char* text) {
            std::string_view view(text);
            const row one = scan::scan<"{[a-z]+},{[a-z]+}">(view);
            return static_cast<int>(one.left.size() + one.right.size());
          }
          EOF
          cat > /tmp/two.cc <<'EOF'
          #include "scan.hpp"
          #include <cstdio>
          int how_long(const char* text);
          int main() { std::printf("%d\n", how_long("left,right")); return 0; }
          EOF
          # The same files, twice: once reading Boost.PFR and once with no
          # Boost on the include path at all.
          for pair in "with-pfr -I$pfr_include -DBOOST_PFR_USE_STD_MODULE=0" \
                      "by-pack -DSCAN_FIELDS_BY_BINDING_PACK=1 -Wno-c++26-extensions"; do
            set -- $pair
            what=$1; shift
            echo "--- $what"
            clang++ -std=c++23 -stdlib=libc++ -I include "$@" \
              -fconstexpr-steps=300000000 -fconstexpr-depth=4096 \
              /tmp/one.cc /tmp/two.cc -o /tmp/both
            test "$(/tmp/both)" = "9"
          done

      # And that the other switch still builds as modules, which nothing else
      # here compiles. Nothing is fetched for it -- that is the point of it.
      - name: the modules, with the other switch
        run: |
          cmake -S . -B build-pack -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/local/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DSCAN_FIELDS_BY_BINDING_PACK=ON -DSCAN_BUILD_TESTS=OFF \
            -DCME_STORE_ENABLED=ON -DCME_SOURCES_ENABLED=ON
          cmake --build build-pack --target scan

      # And the whole of what a consumer does: the library configured as
      # headers, installed, and something built against the prefix.
      - name: as a consumer that cannot take modules
        run: |
          cmake -S . -B build-hdr -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/local/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DSCAN_MODULES=OFF -DSCAN_BUILD_TESTS=OFF \
            -DCME_STORE_ENABLED=ON -DCME_SOURCES_ENABLED=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix-hdr"
          cmake --build build-hdr
          cmake --install build-hdr
          find prefix-hdr -name 'scan.hpp' | head -2
          test -f prefix-hdr/lib/cmake/scan/scanConfig.cmake

      - uses: actions/upload-artifact@v4
        with:
          name: scan-headers
          path: include

      # One pattern to a test, and every one of them is a machine built while
      # it compiles -- so this is the long part of the run and the part worth
      # having.
      - name: the tests
        run: ctest --test-dir build --output-on-failure

      - name: install
        run: cmake --install build

      # What is in the prefix, said out loud: the archive, the module sources
      # a consumer compiles its own interfaces from, a CMake package, and the
      # port declaration that answers for this library on a machine that has
      # it.
      - name: what is in the prefix
        run: |
          find prefix -type f | sort
          test -f prefix/lib/cmake/scan/scanConfig.cmake
          test -f prefix/lib/cmake/scan/scanTargets.cmake
          test -f prefix/lib/scan/modules/src/scan.cc
          test -f prefix/share/cmake-everywhere/ports/scan/port.cmake

      # And a consumer: the sources of this library nowhere in sight, only the
      # prefix. It says two things before project() that are about `import
      # std` rather than about this library -- the gate CMake keeps that
      # support behind, and the request itself; an installed target built with
      # CXX_MODULE_STD says so, and a consumer that has not asked is told the
      # toolchain was never scanned for it.
      #
      # And it installs the provider, which is not a formality here: what this
      # library needs is Boost.PFR as a module, and no machine carries one.
      # The port beside the installed copy says so, and something has to be
      # there to answer it -- so this is the consumer a consumer would
      # actually be, and it uses the same pin this repository does.
      - name: something built against the installed copy
        run: |
          mkdir -p /tmp/consumer/cmake
          cp cmake/get_cme.cmake /tmp/consumer/cmake/
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 4.4 FATAL_ERROR)
          set(CMAKE_EXPERIMENTAL_CXX_IMPORT_STD
              "f35a9ac6-8463-4d38-8eec-5d6008153e7d")
          set(CMAKE_CXX_MODULE_STD 1)
          if(NOT COMMAND cme_declare_port AND NOT CMAKE_PROJECT_TOP_LEVEL_INCLUDES)
            set(CMAKE_PROJECT_TOP_LEVEL_INCLUDES
                ${CMAKE_CURRENT_LIST_DIR}/cmake/get_cme.cmake)
          endif()
          project(scan_consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_EXTENSIONS OFF)
          find_package(scan REQUIRED)
          add_executable(consumer main.cc)
          target_link_libraries(consumer PRIVATE scan::scan)
          EOF
          cat > /tmp/consumer/main.cc <<'EOF'
          import std;
          import scan;

          // The smallest thing that needs all of it: a pattern compiled while
          // this is compiled, the module interfaces to compile it against, and
          // the archive to link.
          struct row {
            std::string_view left;
            std::string_view right;
          };

          int main() {
            const std::string_view text = "left,right";
            const row one = scan::scan<"{[a-z]+},{[a-z]+}">(text);
            return one.left == "left" && one.right == "right" ? 0 : 1;
          }
          EOF
          # The copy in the prefix, and no other. Left to decide for itself,
          # the provider reads the port beside that copy, sees it pinned to a
          # branch whose tip has moved, and fetches the library rather than
          # taking what is here -- which is the right answer for a build that
          # wants the pin, and the wrong one for the step whose whole question
          # is whether what was just installed can be used.
          cmake -S /tmp/consumer -B /tmp/consumer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/local/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCME_SYSTEM_scan=ALWAYS \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build /tmp/consumer/build
          /tmp/consumer/build/consumer

      # The same installed copy, taken the other way.
      #
      # This is the question a prefix answers: the library is installed once,
      # with its module interfaces and the headers beside them, and a project
      # that cannot take modules asks for the headers and gets them from that
      # copy rather than building one of its own. `COMPONENTS headers` is the
      # whole of what it says differently.
      - name: the same copy, asked for as headers
        run: |
          mkdir -p /tmp/by-headers
          cat > /tmp/by-headers/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28 FATAL_ERROR)
          project(by_headers LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_EXTENSIONS OFF)
          find_package(scan REQUIRED COMPONENTS headers)
          add_executable(by_headers main.cc)
          target_link_libraries(by_headers PRIVATE scan::scan)
          EOF
          cat > /tmp/by-headers/main.cc <<'EOF'
          #include <scan.hpp>

          struct row {
            std::string_view left;
            std::string_view right;
          };

          int main() {
            const std::string_view text = "left,right";
            const row one = scan::scan<"{[a-z]+},{[a-z]+}">(text);
            return one.left == "left" && one.right == "right" ? 0 : 1;
          }
          EOF
          pfr=$(find ~/.cache/cmake-everywhere build -name pfr.hpp -path '*boost*' 2>/dev/null | head -1)
          pfr_include=$(dirname "$(dirname "$pfr")")
          cmake -S /tmp/by-headers -B /tmp/by-headers/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/local/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -I$pfr_include -DBOOST_PFR_USE_STD_MODULE=0" \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build /tmp/by-headers/build
          /tmp/by-headers/build/by_headers

      # A consumer that has never heard of modules, fetching this as a port.
      #
      # Not the same question as the two above: those configure this project
      # directly, or read a prefix something else installed. This one is a
      # project of its own that says nothing about `import std`, has no gate
      # set before its project(), and asks the provider for the library --
      # which is what everybody who cannot take modules will actually do.
      - name: a project with no modules at all, through the provider
        run: |
          mkdir -p /tmp/plain/cmake
          cp cmake/get_cme.cmake /tmp/plain/cmake/
          pfr=$(find ~/.cache/cmake-everywhere build -name pfr.hpp -path '*boost*' 2>/dev/null | head -1)
          pfr_include=$(dirname "$(dirname "$pfr")")
          cat > /tmp/plain/CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.28 FATAL_ERROR)
          if(NOT COMMAND cme_declare_port AND NOT CMAKE_PROJECT_TOP_LEVEL_INCLUDES)
            set(CMAKE_PROJECT_TOP_LEVEL_INCLUDES
                \${CMAKE_CURRENT_LIST_DIR}/cmake/get_cme.cmake)
          endif()
          project(plain LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_EXTENSIONS OFF)
          cme_declare_port(NAME scan SOURCE_DIR $PWD)
          find_package(scan REQUIRED COMPONENTS headers)
          add_executable(plain main.cc)
          target_link_libraries(plain PRIVATE scan::scan)
          EOF
          cat > /tmp/plain/main.cc <<'EOF'
          #include <scan.hpp>

          struct row {
            std::string_view left;
            std::string_view right;
          };

          int main() {
            const std::string_view text = "left,right";
            const row one = scan::scan<"{[a-z]+},{[a-z]+}">(text);
            return one.left == "left" && one.right == "right" ? 0 : 1;
          }
          EOF
          # Unix Makefiles on purpose: a build that takes the headers has no
          # modules to scan for, and should not need a generator that can.
          cmake -S /tmp/plain -B /tmp/plain/build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/local/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -I$pfr_include -DBOOST_PFR_USE_STD_MODULE=0"
          cmake --build /tmp/plain/build
          /tmp/plain/build/plain

      # And into the tree.
      #
      # A consumer pins a revision, and a revision that carries the sources
      # should carry what was made from them -- so these are committed rather
      # than attached to a release, and every checkout has them whether it is
      # a release or not.
      #
      # `[skip ci]`, because the run that answers for this content is the one
      # that just made it: these files were generated from this build,
      # compiled, and linked from two translation units a few steps ago.
      - name: the headers, into the tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'j4niwzis'
          git config user.email 'j4niwzis@proton.me'
          git add -A include
          if git diff --cached --quiet; then
            echo "the headers are what they already were"
            exit 0
          fi
          git commit -m "The headers, as this tree generates them [skip ci]"
          # Somebody may have pushed while this was building; what is here is
          # generated from this commit and is not a change to anybody else's.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
